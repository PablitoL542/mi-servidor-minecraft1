name: Servidor Minecraft Mods (1.20.1)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar servidor Forge (1.20.1) y Mods
      run: |
        mkdir -p server/mods
        cd server
        echo "eula=true" > eula.txt
        
        # Descargar e instalar Forge 1.20.1
        FORGE_VERSION="1.20.1-47.2.0"
        echo "Descargando e instalando Forge..."
        curl -s -L -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar
        java -jar installer.jar --installServer > /dev/null 2>&1

    - name: Iniciar Túnel Pinggy en Bucle
      run: |
        cd server
        nohup bash -c 'while true; do ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=10 free@a.pinggy.io R:0:localhost:25565 >> pinggy.log 2>&1; sleep 5; done' > /dev/null 2>&1 &
        echo "Túnel iniciado..."

    - name: Iniciar Minecraft y Mostrar IP
      run: |
        cd server
        echo "Esperando a que Pinggy genere la IP..."
        sleep 15
        
        # Extraer IP limpia
        PINGGY_IP=$(grep -oE '[a-zA-Z0-9.-]+\.a\.pinggy\.link:[0-9]+' pinggy.log | head -n 1)
        
        # Publicar IP en el panel principal de GitHub (Summary)
        echo "## 🎮 IP DEL SERVIDOR DE MINECRAFT" >> $GITHUB_STEP_SUMMARY
        echo "### \`$PINGGY_IP\`" >> $GITHUB_STEP_SUMMARY
        echo "Copia esta IP y pégala en tu Minecraft en **Multijugador > Conexión Directa**." >> $GITHUB_STEP_SUMMARY
        
        echo "===================================================="
        echo "TU IP ES: $PINGGY_IP"
        echo "===================================================="
        
        # Arrancar servidor de Forge
        java -Xms2G -Xmx6G @libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt nogui
