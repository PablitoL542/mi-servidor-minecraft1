name: Servidor Minecraft Mods (1.20.1)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar servidor Forge (1.20.1) y Mods
      run: |
        mkdir -p server/mods
        cd server
        echo "eula=true" > eula.txt
        
        # Descargar e instalar Forge 1.20.1
        FORGE_VERSION="1.20.1-47.2.0"
        echo "Descargando e instalando Forge..."
        curl -s -L -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar
        java -jar installer.jar --installServer > /dev/null 2>&1

    - name: Iniciar túnel Pinggy y Servidor
      run: |
        cd server
        
        # Iniciar Pinggy con parámetros anti-bloqueo y sin esperar interacción
        ssh -p 443 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=30 -n free@a.pinggy.io R:0:localhost:25565 > pinggy.log 2>&1 &
        
        # Darle tiempo suficiente a Forge para levantar el proceso
        echo "Esperando a que el túnel genere la IP..."
        sleep 20
        
        echo "===================================================="
        echo "TU IP PARA ENTRAR A MINECRAFT ES:"
        grep -oE '[a-zA-Z0-9.-]+\.a\.pinggy\.link:[0-9]+' pinggy.log || cat pinggy.log
        echo "===================================================="

        # Arrancar el servidor de Forge
        java -Xms2G -Xmx6G @libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt nogui
