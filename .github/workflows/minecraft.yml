name: Servidor Minecraft Mods (1.20.1)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar servidor Forge (1.20.1) y Mods
      run: |
        mkdir -p server/mods
        cd server
        echo "eula=true" > eula.txt
        
        # Descargar e instalar Forge 1.20.1
        FORGE_VERSION="1.20.1-47.2.0"
        echo "Descargando e instalando Forge..."
        curl -s -L -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar
        java -jar installer.jar --installServer > /dev/null 2>&1

    - name: Iniciar Servidor y Pinggy
      run: |
        cd server
        
        # 1. Iniciar Minecraft de fondo
        echo "Iniciando servidor de Minecraft..."
        java -Xms2G -Xmx6G @libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt nogui &
        
        # 2. Esperar a que el puerto 25565 se abra realmente
        echo "Esperando a que el puerto 25565 esté activo..."
        until nc -z localhost 25565; do
          sleep 3
        done
        echo "¡Puerto de Minecraft detectado!"
        
        # 3. Lanzar Pinggy cuando el puerto ya está abierto
        ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 free@a.pinggy.io R:0:localhost:25565 > pinggy.log 2>&1 &
        
        # 4. Darle 12 segundos para que reciba la URL completa
        echo "Obteniendo IP pública..."
        sleep 12
        
        echo "===================================================="
        echo "TU IP PARA ENTRAR A MINECRAFT ES:"
        grep -oE '[a-zA-Z0-9.-]+\.a\.pinggy\.link:[0-9]+' pinggy.log || cat pinggy.log
        echo "===================================================="
        
        wait
    - name: Iniciar Servidor Minecraft
      run: |
        cd server
        # Arrancar servidor de Forge en primer plano
        java -Xms2G -Xmx6G @libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt nogui
