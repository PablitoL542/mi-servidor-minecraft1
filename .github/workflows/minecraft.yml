name: Servidor Minecraft Mods (1.20.1)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar servidor Forge (1.20.1)
      run: |
        mkdir -p server/mods
        cd server
        echo "eula=true" > eula.txt
        
        # Descargar e instalar Forge
        FORGE_VERSION="1.20.1-47.2.0"
        echo "Descargando e instalando Forge..."
        curl -s -L -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar
        java -jar installer.jar --installServer > /dev/null 2>&1

    - name: Instalar LocalTunnel
      run: |
        npm install -g localtunnel

    - name: Iniciar Minecraft y Publicar IP
      run: |
        cd server
        
        # 1. Iniciar túnel de LocalTunnel al puerto 25565
        lt --port 25565 > lt.log 2>&1 &
        sleep 5
        
        # 2. Extraer URL del túnel
        PUBLIC_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.loca\.lt' lt.log || echo "No se pudo obtener la URL de LocalTunnel")
        
        echo "===================================================="
        echo "TU ENLACE / IP DEL SERVIDOR ES:"
        echo "$PUBLIC_URL"
        echo "===================================================="
        
        # Publicar también en el resumen visual de GitHub
        echo "## 🎮 TU IP / ENLACE DE MINECRAFT" >> $GITHUB_STEP_SUMMARY
        echo "### \`$PUBLIC_URL\`" >> $GITHUB_STEP_SUMMARY

        # 3. Iniciar Minecraft en primer plano
        echo "Iniciando servidor de Minecraft (esto tomará ~2 minutos)..."
        java -Xms2G -Xmx6G @libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt nogui
