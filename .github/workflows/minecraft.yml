name: Servidor Minecraft Mods (1.20.1)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar servidor Forge (1.20.1) y Mods
      run: |
        mkdir -p server/mods
        cd server
        echo "eula=true" > eula.txt
        
        # Descargar e instalar Forge 1.20.1
        FORGE_VERSION="1.20.1-47.2.0"
        echo "Descargando e instalando Forge..."
        curl -s -L -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar
        java -jar installer.jar --installServer > /dev/null 2>&1

    - name: Descargar e Iniciar Playit.gg
      run: |
        cd server
        # Crear la carpeta de configuración que Playit necesita
        mkdir -p ~/.config/playit_gg
        
        echo "Descargando Playit.gg..."
        curl -sL https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -o playit
        chmod +x playit
        
        echo "Iniciando túnel Playit..."
        ./playit claim > playit.log 2>&1 &
        sleep 10
        
        echo "===================================================="
        echo "ENLACE PARA RECLAMAR TU IP/TÚNEL DE PLAYIT:"
        grep -oE 'https://playit.gg/claim/[a-zA-Z0-9]+' playit.log || cat playit.log
        echo "===================================================="
    - name: Iniciar Servidor Minecraft
      run: |
        cd server
        # Arrancar servidor de Forge en primer plano
        java -Xms2G -Xmx6G @libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt nogui
